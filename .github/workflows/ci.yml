name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft marked ready runs the browser lanes it skipped.
    types: [opened, synchronize, reopened, ready_for_review]

# A pull request's newer push supersedes its older run. On main a run in progress always
# finishes (the TestFlight and Play gates need a finished run on the commit they build);
# GitHub still collapses main pushes waiting behind it to the newest.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run check:data-parity
      - run: npm run check:audio
      - run: npm run check:ui-theme
      - run: npm run check:sprites
      - run: npm run check:reference
      - run: npm run build
      - run: npm run test:unit

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:threshold-pr-notes
      # Every vitest file under tests/sim and tests/harness (test:unit excludes both).
      - run: npm run test:sim
      - run: npm run test:harness:pr
      - run: npm run test:harness
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-replays
          path: tests/artifacts/replays/journey/
          if-no-files-found: ignore
      - run: npm run sim:fullrun:pr

  # Browser specs run in lanes defined by tests/e2e/lanes.json (the only place that
  # lists them). This job checks every spec is in a lane (or excluded with a reason)
  # and turns the lanes into the e2e job matrix. It needs node only: no npm ci.
  # A draft pull request skips the browser lanes (about 85% of CI's runner time, and
  # runners are what PRs queue for); they run when it is marked ready for review.
  e2e-lanes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.lanes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:e2e-lanes
      - id: lanes
        run: echo "matrix=$(node tools/e2eLanes.js matrix)" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (${{ matrix.id }})
    needs: e2e-lanes
    runs-on: ubuntu-latest
    # The longest lane shard takes about 21 minutes and a slow browser install up to ~18;
    # a hung job must not hold a runner for the 6-hour default (Oct 2026: installs stalled
    # for hours and starved the queue).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-lanes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Usually 20-35 s, but a slow apt mirror can take many minutes and still finish, so an
      # attempt is never cut short: killing npx leaves its sudo apt-get running and holding
      # the dpkg lock, and every retry then fails at once. The step's own limit catches a
      # real hang; a quick failure (a mirror error) is retried once.
      - name: Install Chromium for Playwright
        timeout-minutes: 25
        run: |
          for attempt in 1 2; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - if: matrix.build
        run: npm run build
      - run: node tools/e2eLanes.js run "${{ matrix.lane }}" ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
      # Per-spec timings (tools/e2eDurationReporter.js), kept for every shard: they are
      # what tests/e2e/durations.json, and so the shard balance, is refreshed from.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-durations-${{ matrix.id }}
          path: e2e-durations/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures-${{ matrix.id }}
          path: |
            test-results/
            test-results-release/
          if-no-files-found: ignore
