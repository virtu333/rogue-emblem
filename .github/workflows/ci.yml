name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request supersedes its older run (main keeps every run).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run check:data-parity
      - run: npm run check:audio
      - run: npm run check:ui-theme
      - run: npm run check:sprites
      - run: npm run check:reference
      - run: npm run build
      - run: npm run test:unit

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:threshold-pr-notes
      # Every vitest file under tests/sim and tests/harness (test:unit excludes both).
      - run: npm run test:sim
      - run: npm run test:harness:pr
      - run: npm run test:harness
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-replays
          path: tests/artifacts/replays/journey/
          if-no-files-found: ignore
      - run: npm run sim:fullrun:pr

  # Browser specs run in lanes defined by tests/e2e/lanes.json (the only place that
  # lists them). This job checks every spec is in a lane (or excluded with a reason)
  # and turns the lanes into the e2e job matrix. It needs node only: no npm ci.
  e2e-lanes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.lanes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:e2e-lanes
      - id: lanes
        run: echo "matrix=$(node tools/e2eLanes.js matrix)" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e (${{ matrix.id }})
    needs: e2e-lanes
    runs-on: ubuntu-latest
    # The longest lane shard takes about 21 minutes; a hung job must not hold a runner
    # for the 6-hour default (Oct 2026: installs stalled for hours and starved the queue).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-lanes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Usually 20-35 s; a stalled apt mirror or download is retried rather than waited on.
      - name: Install Chromium for Playwright
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=15 240 npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $attempt failed or stalled; retrying"
            sleep 10
          done
          exit 1
      - if: matrix.build
        run: npm run build
      - run: node tools/e2eLanes.js run "${{ matrix.lane }}" ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures-${{ matrix.id }}
          path: |
            test-results/
            test-results-release/
          if-no-files-found: ignore
