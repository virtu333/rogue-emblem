name: TestFlight

# Builds and signs the iOS app from the selected ref. Run it from the Actions tab:
# TestFlight -> Run workflow (pick the branch, usually main) and a mode:
#   upload (default)  archive, sign and upload to App Store Connect; it appears in
#                     TestFlight once Apple finishes processing (usually 5-30 minutes)
#   validate          the same signed build, checked by App Store Connect but not
#                     uploaded (for trying out changes to this workflow)
# Either mode first requires the CI workflow to have passed on the exact commit (it waits
# while that run is still going).
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   APP_STORE_CONNECT_KEY_ID       Key ID of an App Store Connect API key (Admin role:
#   APP_STORE_CONNECT_ISSUER_ID    cloud-managed signing creates certificates/profiles)
#   APP_STORE_CONNECT_PRIVATE_KEY  contents of the AuthKey_<id>.p8 file (PEM or base64)
# Optional, only for a cloud-enabled build (the app is offline by default):
#   variables VITE_CLOUD_ENABLED=true and VITE_SUPABASE_URL, secret VITE_SUPABASE_ANON_KEY

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'upload: send it to TestFlight; validate: build and sign only'
        type: choice
        options: [upload, validate]
        default: upload
      build_number:
        description: 'Build number (leave blank: one above the latest in App Store Connect)'
        required: false
        default: ''

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-passed:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for CI on ${{ github.sha }}
        run: |
          set -euo pipefail
          # The newest CI run for this exact commit (a re-run updates the same run) must
          # finish successfully. A commit just merged to main has its push run still going,
          # so wait for it; give GitHub a few minutes to create one before giving up.
          started=$SECONDS
          while :; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '.workflow_runs | sort_by(.created_at) | last // empty | [.status, (.conclusion // ""), .html_url] | @tsv')"
            elapsed=$((SECONDS - started))
            if [ -z "$run" ]; then
              if [ "$elapsed" -ge 300 ]; then
                echo "::error::No CI run exists for $GITHUB_SHA. Build a commit CI has run on (main, or a branch with an open pull request)."
                exit 1
              fi
              echo "No CI run for $GITHUB_SHA yet; waiting."
            else
              IFS=$'\t' read -r status conclusion url <<< "$run"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "CI passed on $GITHUB_SHA: $url"
                  exit 0
                fi
                echo "::error::CI on $GITHUB_SHA finished '$conclusion': $url"
                exit 1
              fi
              echo "CI on $GITHUB_SHA is $status: $url"
            fi
            if [ "$elapsed" -ge 2700 ]; then
              echo "::error::CI on $GITHUB_SHA did not finish within 45 minutes."
              exit 1
            fi
            sleep 30
          done

  # The app bundles every track; a lighter encode keeps its download under Apple's 200 MB
  # cellular limit (tools/ios/compactMusic.mjs). The web game keeps the build's encode.
  ios-music:
    name: Music for the app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Re-encode the music
        run: node tools/ios/compactMusic.mjs --in assets/audio/music --out "$RUNNER_TEMP/ios-music"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-music
          path: ${{ runner.temp }}/ios-music
          if-no-files-found: error
          retention-days: 3

  build:
    name: Build (${{ inputs.mode }})
    needs: [ci-passed, ios-music]
    runs-on: macos-26
    timeout-minutes: 75
    env:
      BUNDLE_ID: com.davechen.emblemrogue
      TEAM_ID: Y463W47P77
      PROJECT: ios/App/App.xcodeproj
      SCHEME: App
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          node --version

      - name: Check secrets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$ASC_PRIVATE_KEY" ] || missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Install the API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            # Pasted PEM; %b also turns literal "\n" sequences into newlines.
            printf '%b\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          if ! openssl pkey -in "$KEY_PATH" -noout 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is not a readable .p8 private key (paste the whole file, including the BEGIN/END lines)."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$KEY_DIR" >> "$GITHUB_ENV"

      - name: Build number
        env:
          REQUESTED_BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          PROJECT_BUILD="$(grep -m1 -o 'CURRENT_PROJECT_VERSION = [0-9]*' "$PROJECT/project.pbxproj" | grep -o '[0-9]*$')"
          if [ -n "$REQUESTED_BUILD" ]; then
            BUILD_NUMBER="$REQUESTED_BUILD"
          else
            BUILD_NUMBER="$(node tools/ios/nextBuildNumber.mjs --bundle-id "$BUNDLE_ID" --min "$((PROJECT_BUILD + 1))")"
          fi
          case "$BUILD_NUMBER" in ''|*[!0-9]*) echo "::error::Bad build number '$BUILD_NUMBER'"; exit 1;; esac
          MARKETING_VERSION="$(grep -m1 -o 'MARKETING_VERSION = [0-9.]*' "$PROJECT/project.pbxproj" | grep -o '[0-9.]*$')"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "Building $MARKETING_VERSION ($BUILD_NUMBER)"

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: ios-music
          path: ${{ runner.temp }}/ios-music

      - name: Build the web game and sync iOS
        env:
          VITE_CLOUD_ENABLED: ${{ vars.VITE_CLOUD_ENABLED }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          npm run build
          # the app's lighter music: the same files, re-encoded (the ios-music job)
          MUSIC=dist/assets/audio/music
          diff <(ls "$MUSIC") <(ls "$RUNNER_TEMP/ios-music") \
            || { echo "::error::the app's music doesn't match the build's track list"; exit 1; }
          echo "Music: $(du -sh "$MUSIC" | cut -f1) -> $(du -sh "$RUNNER_TEMP/ios-music" | cut -f1)"
          cp "$RUNNER_TEMP"/ios-music/*.mp3 "$MUSIC"/
          echo "Web game: $(du -sh dist | cut -f1)"
          npx cap sync ios
          if ! git diff --quiet -- ios/App/CapApp-SPM/Package.swift; then
            echo "::warning::cap sync changed ios/App/CapApp-SPM/Package.swift; commit the regenerated file."
            git diff -- ios/App/CapApp-SPM/Package.swift
          fi
          test -f ios/App/App/public/index.html

      - name: Signing keychain
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild -list -project "$PROJECT"
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Check the archive
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          PLIST="$APP/Info.plist"
          test -d "$APP"
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy is missing from App.app"; exit 1; }
          test -f "$APP/public/index.html" || { echo "::error::the web game is missing from App.app"; exit 1; }
          # Apple asks before a cellular download over 200 MB; the download is about the app's size
          APP_MB=$(( $(du -sk "$APP" | cut -f1) / 1024 ))
          echo "App.app: ${APP_MB} MB"
          if [ "$APP_MB" -gt 190 ]; then
            echo "::warning::App.app is ${APP_MB} MB, close to the 200 MB cellular download limit"
          fi
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "$NAME $BUNDLE $SHORT ($BUILD)"
          [ "$BUNDLE" = "$BUNDLE_ID" ] || { echo "::error::bundle ID $BUNDLE"; exit 1; }
          [ "$BUILD" = "$BUILD_NUMBER" ] || { echo "::error::CFBundleVersion $BUILD, expected $BUILD_NUMBER"; exit 1; }

      - name: Export (${{ inputs.mode }})
        run: |
          set -euo pipefail
          case "$MODE" in
            upload) DESTINATION=upload ;;
            validate) DESTINATION=export ;;
            *) echo "::error::Unknown mode '$MODE'"; exit 1 ;;
          esac
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DESTINATION}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Check the signed app
        if: inputs.mode == 'validate'
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa)"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"
          rm -rf "$RUNNER_TEMP/ipa" && mkdir "$RUNNER_TEMP/ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP="$RUNNER_TEMP/ipa/Payload/App.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          AUTHORITY="$(codesign -dvv "$APP" 2>&1 | grep -m1 '^Authority=' || true)"
          echo "$AUTHORITY"
          case "$AUTHORITY" in
            *"Apple Distribution"*|*"iPhone Distribution"*) ;;
            *) echo "::error::App.app is not signed for distribution ($AUTHORITY)"; exit 1 ;;
          esac
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::error::the embedded profile lists devices, so it is not an App Store profile"
            exit 1
          fi

      - name: Validate with App Store Connect
        if: inputs.mode == 'validate'
        run: |
          set -euo pipefail
          # Apple's server-side checks, without uploading; run from RUNNER_TEMP so altool
          # also finds the key in ./private_keys.
          if ! xcrun --find altool >/dev/null 2>&1; then
            echo "::warning::altool is not in this Xcode, so App Store Connect validation was skipped; the signed IPA was still built and checked."
            exit 0
          fi
          cd "$RUNNER_TEMP"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/validate.log"

      - name: Summary
        run: |
          {
            if [ "$MODE" = upload ]; then
              echo "### Uploaded Rogue Dawn $MARKETING_VERSION ($BUILD_NUMBER)"
            else
              echo "### Validated Rogue Dawn $MARKETING_VERSION ($BUILD_NUMBER), not uploaded"
            fi
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
            echo "- Cloud: ${{ vars.VITE_CLOUD_ENABLED == 'true' && 'enabled' || 'off (offline build)' }}"
            if [ "$MODE" = upload ]; then
              echo "- It appears in App Store Connect -> TestFlight once Apple finishes processing."
            else
              echo "- The signed App Store build passed. Run again with mode **upload** to send it to TestFlight."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/validate.log
            ${{ runner.temp }}/export/*.plist
            ${{ runner.temp }}/export/*.log
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: |
          if [ -n "${API_PRIVATE_KEYS_DIR:-}" ]; then rm -rf "$API_PRIVATE_KEYS_DIR"; fi
          if [ -n "${ASC_KEY_PATH:-}" ]; then rm -f "$ASC_KEY_PATH"; fi
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
