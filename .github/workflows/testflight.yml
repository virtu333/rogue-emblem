name: TestFlight

# Builds and signs the iOS app from the selected ref. Run it from the Actions tab:
# TestFlight -> Run workflow (pick the branch, usually main) and a mode:
#   upload (default)  archive, sign and upload to App Store Connect; it appears in
#                     TestFlight once Apple finishes processing (usually 5-30 minutes)
#   validate          the same signed build, checked by App Store Connect but not
#                     uploaded (for trying out changes to this workflow)
#   status            no build: what App Store Connect did with the recent builds (Apple's
#                     processing result and TestFlight state), in the run's summary
# Upload and validate first require the CI workflow to have passed on the exact commit (it
# waits while that run is still going). An upload then waits for Apple to process the
# build and fails if Apple rejects it. A pull request that changes the iOS project or this
# pipeline runs it in validate mode.
#
# Signing: the archive is built unsigned and the export signs it for App Store
# distribution through Xcode's cloud-managed signing, which needs no registered devices
# (an automatically signed archive would need an iOS development profile, and those
# require at least one registered device).
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   APP_STORE_CONNECT_KEY_ID       Key ID of an App Store Connect API key (Admin role:
#   APP_STORE_CONNECT_ISSUER_ID    cloud-managed signing creates certificates/profiles)
#   APP_STORE_CONNECT_PRIVATE_KEY  contents of the AuthKey_<id>.p8 file (PEM or base64)
# Optional, only for a cloud-enabled build (the app is offline by default):
#   variables VITE_CLOUD_ENABLED=true and VITE_SUPABASE_URL, secret VITE_SUPABASE_ANON_KEY

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'upload: send it to TestFlight; validate: build and sign only; status: report on recent builds'
        type: choice
        options: [upload, validate, status]
        default: upload
      build_number:
        description: 'Build number (leave blank: one above the latest in App Store Connect)'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/testflight.yml
      - ios/**
      - tools/ios/**
      - capacitor.config.*

concurrency:
  # Uploads queue one at a time (a status check never waits behind them); a pull
  # request's newer push replaces its older check.
  group: testflight-${{ github.event_name == 'pull_request' && github.ref || (inputs.mode == 'status' && format('status-{0}', github.run_id)) || 'upload' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-passed:
    name: CI passed on this commit
    # Pull requests from forks get no secrets, so only this repository's own branches.
    if: >-
      (github.event_name != 'pull_request' && inputs.mode != 'status') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      # A pull request run checks out the merge commit; CI ran on the branch head.
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Wait for CI on ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # The newest CI run for this exact commit (a re-run updates the same run) must
          # finish successfully. A commit just merged to main has its push run still going,
          # so wait for it; give GitHub a few minutes to create one before giving up.
          started=$SECONDS
          while :; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&per_page=50" \
              --jq '.workflow_runs | sort_by(.created_at) | last // empty | [.status, (.conclusion // ""), .html_url] | @tsv')"
            elapsed=$((SECONDS - started))
            if [ -z "$run" ]; then
              if [ "$elapsed" -ge 300 ]; then
                echo "::error::No CI run exists for $COMMIT. Build a commit CI has run on (main, or a branch with an open pull request)."
                exit 1
              fi
              echo "No CI run for $COMMIT yet; waiting."
            else
              IFS=$'\t' read -r status conclusion url <<< "$run"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "CI passed on $COMMIT: $url"
                  exit 0
                fi
                echo "::error::CI on $COMMIT finished '$conclusion': $url"
                exit 1
              fi
              echo "CI on $COMMIT is $status: $url"
            fi
            if [ "$elapsed" -ge 2700 ]; then
              echo "::error::CI on $COMMIT did not finish within 45 minutes."
              exit 1
            fi
            sleep 30
          done

  build:
    name: Build (${{ inputs.mode || 'validate' }})
    needs: ci-passed
    runs-on: macos-26
    timeout-minutes: 75
    env:
      BUNDLE_ID: com.davechen.emblemrogue
      TEAM_ID: Y463W47P77
      PROJECT: ios/App/App.xcodeproj
      SCHEME: App
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      MODE: ${{ inputs.mode || 'validate' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          node --version

      - name: Check secrets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$ASC_PRIVATE_KEY" ] || missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Install the API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: tools/ios/installApiKey.sh

      - name: Build number
        env:
          REQUESTED_BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          PROJECT_BUILD="$(grep -m1 -o 'CURRENT_PROJECT_VERSION = [0-9]*' "$PROJECT/project.pbxproj" | grep -o '[0-9]*$')"
          if [ -n "$REQUESTED_BUILD" ]; then
            BUILD_NUMBER="$REQUESTED_BUILD"
          else
            BUILD_NUMBER="$(node tools/ios/nextBuildNumber.mjs --bundle-id "$BUNDLE_ID" --min "$((PROJECT_BUILD + 1))")"
          fi
          case "$BUILD_NUMBER" in ''|*[!0-9]*) echo "::error::Bad build number '$BUILD_NUMBER'"; exit 1;; esac
          MARKETING_VERSION="$(grep -m1 -o 'MARKETING_VERSION = [0-9.]*' "$PROJECT/project.pbxproj" | grep -o '[0-9.]*$')"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "Building $MARKETING_VERSION ($BUILD_NUMBER)"

      - run: npm ci

      - name: Build the web game and sync iOS
        env:
          VITE_CLOUD_ENABLED: ${{ vars.VITE_CLOUD_ENABLED }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          npm run ios:sync
          if ! git diff --quiet -- ios/App/CapApp-SPM/Package.swift; then
            echo "::warning::cap sync changed ios/App/CapApp-SPM/Package.swift; commit the regenerated file."
            git diff -- ios/App/CapApp-SPM/Package.swift
          fi
          test -f ios/App/App/public/index.html

      - name: Signing keychain
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive (unsigned; the export signs it)
        run: |
          set -euo pipefail
          xcodebuild -list -project "$PROJECT"
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Check the archive
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          PLIST="$APP/Info.plist"
          test -d "$APP"
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy is missing from App.app"; exit 1; }
          test -f "$APP/public/index.html" || { echo "::error::the web game is missing from App.app"; exit 1; }
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST")
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          echo "$NAME $BUNDLE $SHORT ($BUILD)"
          [ "$BUNDLE" = "$BUNDLE_ID" ] || { echo "::error::bundle ID $BUNDLE"; exit 1; }
          [ "$BUILD" = "$BUILD_NUMBER" ] || { echo "::error::CFBundleVersion $BUILD, expected $BUILD_NUMBER"; exit 1; }

      - name: Export and sign (${{ inputs.mode || 'validate' }})
        run: |
          set -euo pipefail
          case "$MODE" in
            upload) DESTINATION=upload ;;
            validate) DESTINATION=export ;;
            *) echo "::error::Unknown mode '$MODE'"; exit 1 ;;
          esac
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DESTINATION}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Check the signed app
        if: env.MODE == 'validate'
        run: |
          set -euo pipefail
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa)"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"
          rm -rf "$RUNNER_TEMP/ipa" && mkdir "$RUNNER_TEMP/ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP="$RUNNER_TEMP/ipa/Payload/App.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          AUTHORITY="$(codesign -dvv "$APP" 2>&1 | grep -m1 '^Authority=' || true)"
          echo "$AUTHORITY"
          case "$AUTHORITY" in
            *"Apple Distribution"*|*"iPhone Distribution"*) ;;
            *) echo "::error::App.app is not signed for distribution ($AUTHORITY)"; exit 1 ;;
          esac
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist"
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::error::the embedded profile lists devices, so it is not an App Store profile"
            exit 1
          fi

      - name: Validate with App Store Connect
        if: env.MODE == 'validate'
        run: |
          set -euo pipefail
          # Apple's server-side checks, without uploading; run from RUNNER_TEMP so altool
          # also finds the key in ./private_keys.
          if ! xcrun --find altool >/dev/null 2>&1; then
            echo "::warning::altool is not in this Xcode, so App Store Connect validation was skipped; the signed IPA was still built and checked."
            exit 0
          fi
          cd "$RUNNER_TEMP"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/validate.log"

      - name: Summary
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            if [ "$MODE" = upload ]; then
              echo "### Uploaded Rogue Dawn $MARKETING_VERSION ($BUILD_NUMBER)"
            else
              echo "### Validated Rogue Dawn $MARKETING_VERSION ($BUILD_NUMBER), not uploaded"
            fi
            echo ""
            echo "- Commit: \`${COMMIT::7}\` on \`${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}\`"
            echo "- Cloud: ${{ vars.VITE_CLOUD_ENABLED == 'true' && 'enabled' || 'off (offline build)' }}"
            if [ "$MODE" = upload ]; then
              echo "- Apple's processing result follows; the build appears in App Store Connect -> TestFlight once it is processed."
            else
              echo "- The signed App Store build passed. Run again with mode **upload** to send it to TestFlight."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: App Store Connect status
        run: |
          # Not -e: the report's exit code decides the outcome below.
          set +e -uo pipefail
          # An upload waits for Apple to process the build and fails if Apple rejects it
          # (still processing after 30 minutes is only a warning). Validate just reports.
          if [ "$MODE" = upload ]; then
            node tools/ios/buildStatus.mjs --bundle-id "$BUNDLE_ID" \
              --wait-for "$BUILD_NUMBER" --timeout-minutes 30 > "$RUNNER_TEMP/status.md"
          else
            node tools/ios/buildStatus.mjs --bundle-id "$BUNDLE_ID" > "$RUNNER_TEMP/status.md"
          fi
          code=$?
          cat "$RUNNER_TEMP/status.md"
          { echo ""; cat "$RUNNER_TEMP/status.md"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = 2 ] && [ "$MODE" = upload ]; then
            echo "::warning::Could not read the build's status from App Store Connect (the upload itself succeeded); run the workflow in status mode later."
            exit 0
          fi
          exit $code

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            ${{ runner.temp }}/validate.log
            ${{ runner.temp }}/export/*.plist
            ${{ runner.temp }}/export/*.log
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: |
          if [ -n "${API_PRIVATE_KEYS_DIR:-}" ]; then rm -rf "$API_PRIVATE_KEYS_DIR"; fi
          if [ -n "${ASC_KEY_PATH:-}" ]; then rm -f "$ASC_KEY_PATH"; fi
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

  status:
    name: App Store Connect status
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUNDLE_ID: com.davechen.emblemrogue
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: tools/ios/installApiKey.sh

      - name: Recent builds
        run: |
          set -euo pipefail
          node tools/ios/buildStatus.mjs --bundle-id "$BUNDLE_ID" --limit 15 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          if [ -n "${API_PRIVATE_KEYS_DIR:-}" ]; then rm -rf "$API_PRIVATE_KEYS_DIR"; fi
