<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed dark background (opaque: iOS apple-touch-icon ignores transparency) -->
  <rect width="512" height="512" fill="#0a0c1e"/>
  <!-- Art scaled to ~82% so corners stay clear of iOS rounded-corner masking -->
  <g transform="translate(256 256) scale(0.82) translate(-256 -256)">
    <!-- Emblem ring (title-screen gold palette) -->
    <circle cx="256" cy="256" r="228" fill="none" stroke="#a67c2e" stroke-width="6"/>
    <circle cx="256" cy="256" r="214" fill="none" stroke="#e8b849" stroke-width="4"/>
    <!-- Crossed swords, mirroring the title divider motif -->
    <g transform="rotate(-45 256 256)">
      <polygon points="256,96 270,164 270,300 242,300 242,164" fill="#e8b849"/>
      <polygon points="256,110 261,168 261,298 251,298 251,168" fill="#f5d77a"/>
      <rect x="210" y="300" width="92" height="18" rx="4" fill="#e8b849"/>
      <rect x="247" y="318" width="18" height="74" fill="#a67c2e"/>
      <circle cx="256" cy="398" r="14" fill="#e8b849"/>
    </g>
    <g transform="rotate(45 256 256)">
      <polygon points="256,96 270,164 270,300 242,300 242,164" fill="#e8b849"/>
      <polygon points="256,110 261,168 261,298 251,298 251,168" fill="#f5d77a"/>
      <rect x="210" y="300" width="92" height="18" rx="4" fill="#e8b849"/>
      <rect x="247" y="318" width="18" height="74" fill="#a67c2e"/>
      <circle cx="256" cy="398" r="14" fill="#e8b849"/>
    </g>
  </g>
</svg>
