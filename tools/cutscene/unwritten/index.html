<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unwritten Page Player</title>
    <style>
      @font-face {
        font-family: 'Cinzel';
        src: url('/docs/art-direction/board/fonts/Cinzel-latin-var.woff2') format('woff2');
        font-weight: 400 900;
        font-display: block;
      }
      :root {
        color-scheme: dark;
        --bg: #07060b;
        --fg: #ddd0bd;
        --dim: #978b94;
        --gold: #dca044;
        --panel: #16131e;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          13px system-ui,
          sans-serif;
      }
      main {
        display: grid;
        gap: 10px;
        padding: 16px;
        max-width: 1440px;
        margin: 0 auto;
      }
      canvas {
        width: 100%;
        aspect-ratio: 16 / 9;
        image-rendering: pixelated;
        background: var(--bg);
        display: block;
      }
      .bar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        background: var(--gold);
        color: var(--bg);
        border: 0;
        padding: 6px 14px;
        cursor: pointer;
      }
      #time {
        flex: 1;
        min-width: 160px;
      }
      #clock {
        font-variant-numeric: tabular-nums;
        color: var(--dim);
        min-width: 150px;
      }
      details {
        background: var(--panel);
        padding: 8px 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 6px 16px;
        margin-top: 8px;
      }
      label {
        display: grid;
        grid-template-columns: 90px 1fr 42px;
        gap: 8px;
        align-items: center;
        color: var(--dim);
      }
      output {
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }
      body.export main {
        padding: 0;
        max-width: none;
      }
      body.export .bar,
      body.export details {
        display: none;
      }
      @media (max-width: 600px) {
        main {
          padding: 16px 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="c" width="480" height="270"></canvas>
      <div class="bar">
        <button id="play">Play</button>
        <input id="time" type="range" min="0" max="60" step="0.01" value="0" />
        <span id="clock">bar · 0.00 s</span>
        <label style="grid-template-columns: auto auto; gap: 6px"
          ><input id="pixel" type="checkbox" checked /> pixel</label
        >
      </div>
      <details open>
        <summary>Tuning (lines rebuild on change)</summary>
        <div class="grid" id="params"></div>
        <div class="bar" style="margin-top: 8px">
          <button id="copy">Copy settings</button
          ><span id="status" style="color: var(--dim)"></span>
        </div>
      </details>
    </main>
    <audio id="music" src="/References/cutscene/unwritten/broken_sun.mp3" preload="auto"></audio>
    <script type="module">
      import { DEFAULTS } from './engine/stages.js';

      const params = new URLSearchParams(location.search);
      // ?piece=again (default): bars 28-56 of the opening; ?piece=proof: the first proof;
      // ?piece=ford: the vertical slice (FORD.md), with its previs and the world test
      const PIECES = {
        again: () => import('./again.js'),
        proof: () => import('./proof.js'),
        ford: () => import('./ford.js'),
        ford_previs: () => import('./ford_previs.js'),
        world_test: () => import('./world_test.js'),
        loco_test: () => import('./loco_test.js'),
        figure_test: () => import('./figure_test.js'),
        skin_test: () => import('./skin_test.js'),
        camp: () => import('./camp.js'),
        camp_previs: () => import('./camp_previs.js'),
      };
      const which = params.get('piece') || 'again';
      const mod = await (PIECES[which] || PIECES.again)();
      const { W, H, DURATION, MUSIC_OFFSET, BAR, FIRST_BAR } = mod;
      if (params.has('export')) document.body.classList.add('export');
      const cv = document.getElementById('c');
      const g = cv.getContext('2d');
      const img = g.createImageData(W, H);
      const proof = new (mod.Again || mod.Proof || mod.PieceClass)();
      const SHOTS = mod.SHOTS || mod.SHOTS_OF(proof);
      const status = document.getElementById('status');
      status.textContent = 'loading…';
      await proof.load();
      status.textContent = '';

      const view = { pixel: true, dither: 0.45 };
      const draw = (t) => {
        proof.render(img.data, t, view);
        g.putImageData(img, 0, 0);
      };

      // --- tuning panel: each control is one engine parameter ---
      const SLIDERS = [
        ['sigma', 0.4, 2, 0.05, 'line width'],
        ['gain', 4, 60, 1, 'line strength'],
        ['lineLo', 0.02, 0.6, 0.01, 'line floor'],
        ['pencilLo', 0.1, 0.8, 0.01, 'pencil floor'],
        ['tint', 0, 0.5, 0.01, 'wash hint'],
        ['dither', 0, 1, 0.05, 'dither'],
      ];
      const settings = { ...DEFAULTS, dither: view.dither };
      let rebuild = null;
      const box = document.getElementById('params');
      for (const [key, min, max, step, name] of SLIDERS) {
        const l = document.createElement('label');
        l.innerHTML = `<span>${name}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${settings[key]}"><output>${settings[key]}</output>`;
        const input = l.querySelector('input');
        const out = l.querySelector('output');
        input.addEventListener('input', () => {
          settings[key] = Number(input.value);
          out.textContent = input.value;
          if (key === 'dither') {
            view.dither = settings.dither;
            draw(current());
            return;
          }
          settings.lineHi = settings.lineLo + 0.24;
          settings.pencilHi = settings.pencilLo + 0.26;
          clearTimeout(rebuild);
          rebuild = setTimeout(() => {
            proof.build(settings);
            draw(current());
          }, 150);
        });
        box.append(l);
      }
      document.getElementById('copy').onclick = async () => {
        const s = JSON.stringify(settings, null, 2);
        try {
          await navigator.clipboard.writeText(s);
          status.textContent = 'copied';
        } catch {
          status.textContent = s;
        }
      };

      // --- playback on the score's clock ---
      const music = document.getElementById('music');
      const slider = document.getElementById('time');
      slider.max = DURATION;
      const clock = document.getElementById('clock');
      let playing = false;
      let t0 = 0;
      let wall = 0;
      const current = () => {
        if (!playing) return Number(slider.value);
        if (!music.paused && music.readyState >= 2) return music.currentTime - MUSIC_OFFSET;
        return t0 + (performance.now() - wall) / 1000;
      };
      const label = (t) => {
        const bar = 1 + Math.floor((t + MUSIC_OFFSET) / BAR);
        const shot = SHOTS.find((s) => t >= s.from && t < s.to) || SHOTS[SHOTS.length - 1];
        clock.textContent = `bar ${Math.min(bar, 56)} · ${t.toFixed(2)} s · ${shot.name}`;
      };
      const tick = () => {
        if (!playing) return;
        let t = current();
        if (t >= DURATION) {
          playing = false;
          music.pause();
          t = DURATION - 0.001;
          document.getElementById('play').textContent = 'Play';
        }
        slider.value = t;
        label(t);
        draw(t);
        if (playing) requestAnimationFrame(tick);
      };
      document.getElementById('play').onclick = async () => {
        playing = !playing;
        document.getElementById('play').textContent = playing ? 'Pause' : 'Play';
        if (playing) {
          t0 = Number(slider.value) >= DURATION - 0.05 ? 0 : Number(slider.value);
          wall = performance.now();
          music.currentTime = MUSIC_OFFSET + t0;
          try {
            await music.play();
          } catch {
            /* no audio: run on the wall clock */
          }
          requestAnimationFrame(tick);
        } else music.pause();
      };
      slider.oninput = () => {
        const t = Number(slider.value);
        label(t);
        draw(t);
        if (playing) {
          t0 = t;
          wall = performance.now();
          music.currentTime = MUSIC_OFFSET + t;
        }
      };
      document.getElementById('pixel').onchange = (e) => {
        view.pixel = e.target.checked;
        draw(current());
      };
      const start = Number(params.get('t') || 0);
      slider.value = start;
      label(start);
      draw(start);

      // --- the exporter's contract (tools/cutscene/render.mjs) ---
      const big = document.createElement('canvas');
      big.width = W * 4;
      big.height = H * 4;
      const bg = big.getContext('2d');
      bg.imageSmoothingEnabled = false;
      window.cutscene = {
        ready: { duration: DURATION, shots: SHOTS },
        frame(t) {
          draw(t);
          bg.drawImage(cv, 0, 0, big.width, big.height);
          return big.toDataURL('image/png');
        },
      };
    </script>
  </body>
</html>
