<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Rogue Emblem</title>
    <!-- PWA: installable as a fullscreen, landscape home-screen app (sheds browser chrome on mobile).
         Paths are relative to stay correct under Vite base:'./'. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0a0c1e" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <!-- iOS standalone: apple-mobile-web-app-capable is deprecated but still required by Safari
         for standalone fallback + splash screens, so include it alongside the standardized tag. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" (not black-translucent): black-translucent renders content under the iOS
         status bar, and the layout reserves no safe-area-inset-top, so the FIT-centered
         canvas top would be obscured. "black" keeps content below the bar. No real-estate
         cost in landscape (iPhone hides the status bar there anyway). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Rogue Emblem" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0c1e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: monospace;
        overflow: hidden;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Auth overlay — The Hollow Sun key art (mounted by main.js through the shared
         backdrop helper, src/art/keyart/keyArtBackdrop.js) under the lockup and form.
         Only shown by main.js, after the game stylesheet (--re-* tokens) has loaded. */
      #auth-overlay {
        position: fixed;
        inset: 0;
        display: none;
        z-index: 100;
        overflow: hidden;
        background: var(--re-void);
        color: var(--re-text);
        font-family: var(--re-body);
      }
      /* The art box: the whole screen on touch devices, the 4:3 stage on desktop
         (the same framing as the title screen that follows). */
      #auth-wrapper {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--re-void);
      }
      @media (pointer: fine) {
        #auth-wrapper {
          margin: auto;
          width: min(100vw, calc(100dvh * 4 / 3));
          height: min(100dvh, calc(100vw * 3 / 4));
        }
      }
      #auth-wrapper::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(90deg, var(--re-shade) 0%, transparent 42%);
      }
      #auth-content {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
        align-items: end;
        gap: 16px;
        padding: max(16px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        overflow-y: auto;
        box-sizing: border-box;
      }
      #auth-content .re-keyart-lockup {
        --rt-h1: clamp(28px, 9.6vh, 42px);
        align-self: start;
        justify-self: start;
        margin: clamp(0px, 3vh, 18px) 0 0 clamp(0px, 3.5vw, 30px);
      }
      @media (pointer: fine) {
        #auth-content {
          margin: auto;
          width: min(100vw, calc(100dvh * 4 / 3));
          height: min(100dvh, calc(100vw * 3 / 4));
        }
      }
      /* The panel sits low and right so the Hollow Sun stays visible above it. */
      .auth-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
        padding: 12px;
        background: linear-gradient(180deg, var(--re-shade-edge), var(--re-shade-deep));
        border: 1px solid var(--re-line);
        box-shadow: inset 0 1px 0 var(--re-raised-haze);
      }
      #auth-form {
        grid-column: 1 / -1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #auth-error,
      #offline-confirm {
        grid-column: 1 / -1;
      }
      #auth-content input {
        min-height: 44px;
        padding: 8px 12px;
        box-sizing: border-box;
        font: 16px/1.4 var(--re-body);
        color: var(--re-text);
        background: var(--re-sunken);
        border: 1px solid var(--re-line);
        border-radius: 0;
        outline: none;
      }
      #auth-content input::placeholder {
        color: var(--re-muted);
      }
      #auth-content input:focus {
        border-color: var(--re-accent);
        box-shadow: inset 2px 0 0 var(--re-accent);
      }
      #auth-content button {
        min-height: 44px;
        padding: 8px 12px;
        font: 600 14px/1.3 var(--re-body);
        color: var(--re-text);
        background: var(--re-panel);
        border: 1px solid var(--re-line);
        cursor: pointer;
      }
      #auth-content button:focus-visible {
        outline: 2px solid var(--re-focus);
        outline-offset: -4px;
      }
      #auth-content #auth-submit {
        font: var(--re-pf-10, 10px)/1 var(--re-pixel);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--re-void);
        background: var(--re-ember-fill);
        border-color: var(--re-accent-text);
      }
      #auth-content #auth-submit:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #auth-content #auth-toggle,
      #auth-content #auth-skip {
        padding: 6px 8px;
        font: 13px/1.25 var(--re-body);
        color: var(--re-muted);
        background: transparent;
        border-color: var(--re-line-soft);
      }
      @media (hover: hover) {
        #auth-content button:hover {
          border-color: var(--re-accent);
          color: var(--re-accent-text);
        }
        #auth-content #auth-submit:hover {
          color: var(--re-void);
          background: var(--re-ember-fill-hi);
        }
      }
      #auth-error {
        min-height: 1.4em;
        margin: 0;
        font: 14px/1.4 var(--re-body);
        color: var(--re-bad);
        text-align: center;
      }
      #auth-error:empty {
        min-height: 0;
      }
      /* Portrait (the auth gate suppresses the rotate prompt): lockup above the form. */
      @media (orientation: portrait) {
        #auth-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: space-between;
        }
        #auth-content .re-keyart-lockup {
          --rt-h1: clamp(24px, 7.4vw, 38px);
          justify-self: center;
          margin: 12px 0 8px;
        }
        .auth-panel {
          width: min(420px, 100%);
          box-sizing: border-box;
        }
      }
      #offline-confirm {
        width: min(400px, calc(100vw - 48px));
        max-height: calc(100dvh - 48px);
        box-sizing: border-box;
        overflow: auto;
        padding: 20px;
        border: 1px solid var(--re-accent);
        background: var(--re-panel);
        color: var(--re-text);
        font: 16px/1.5 var(--re-body);
      }
      #offline-confirm::backdrop {
        background: var(--re-scrim);
      }
      #offline-confirm h2 {
        margin-top: 0;
        font: var(--re-pf-10, 10px)/1.6 var(--re-pixel);
        color: var(--re-accent-text);
        text-transform: uppercase;
      }
      #offline-confirm button {
        display: block;
        width: 100%;
        margin-top: 8px;
      }
      #offline-confirm [data-offline-continue] {
        color: var(--re-void);
        background: var(--re-ember-fill);
        border-color: var(--re-accent-text);
      }

      #game-container {
        display: none;
        background: #0a0c1e;
        flex-shrink: 0;
        touch-action: none;
      }

      /* --- Mobile virtual controls --- */
      #game-wrapper {
        display: none;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh;
        width: 100vw;
        touch-action: manipulation;
      }
      .mobile-panel {
        display: none;
        flex-direction: column;
        justify-content: flex-end;
        gap: 8px;
        padding: 8px;
        width: 80px;
        height: 100%;
        box-sizing: border-box;
      }
      #mobile-left-panel {
        width: calc(80px + var(--re-safe-left, env(safe-area-inset-left, 0px)));
        padding-left: calc(8px + var(--re-safe-left, env(safe-area-inset-left, 0px)));
        padding-bottom: max(8px, env(safe-area-inset-bottom, 8px));
      }
      #mobile-right-panel {
        width: calc(80px + var(--re-safe-right, env(safe-area-inset-right, 0px)));
        padding-right: calc(8px + var(--re-safe-right, env(safe-area-inset-right, 0px)));
        padding-bottom: max(8px, env(safe-area-inset-bottom, 8px));
      }
      .mobile-btn {
        min-width: 48px;
        min-height: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
        transition:
          border-color 0.15s,
          transform 0.1s;
        padding: 4px 2px;
      }
      .mobile-btn:active {
        transform: scale(0.95);
        border-color: rgba(255, 255, 255, 0.6);
      }
      .mobile-btn:disabled {
        opacity: 0.5;
      }
      .mobile-btn-icon {
        font-size: 18px;
        line-height: 1;
      }
      .mobile-btn-label {
        font-size: 9px;
        line-height: 1;
        white-space: nowrap;
      }

      /* Desktop: always hide mobile panels and rotate prompt */
      @media (pointer: fine) {
        .mobile-panel,
        #rotate-prompt {
          display: none !important;
        }
      }
      /* Portrait: hide panels, show rotate prompt */
      @media (pointer: coarse) and (orientation: portrait) {
        .mobile-panel {
          display: none !important;
        }
        #rotate-prompt {
          display: flex !important;
        }
      }
      /* Landscape mobile: contain canvas, keep panels above */
      @media (pointer: coarse) and (orientation: landscape) {
        #game-container {
          flex: 1 1 0%;
          min-width: 0;
          position: relative;
          overflow: hidden;
        }
        .mobile-panel {
          position: relative;
          z-index: 10;
          flex-shrink: 0;
        }
      }

      #rotate-prompt {
        position: fixed;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        background: #0a0c1e;
        color: #8888aa;
        font-family: 'Press Start 2P', monospace;
        font-size: var(--re-pf-14, 14px);
        z-index: calc(var(--re-depth-menu, 1250) + 10);
        cursor: default;
        flex-direction: column;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /* Service-worker update toast — passive, bottom-right, above the canvas.
         Matches the auth overlay's navy/gold pixel language. Only the toast itself
         is interactive; the rest of the page keeps its own pointer handling. */
      .sw-update-toast {
        position: fixed;
        right: max(12px, env(safe-area-inset-right, 12px));
        bottom: max(12px, env(safe-area-inset-bottom, 12px));
        z-index: calc(var(--re-depth-menu, 1250) - 1);
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: min(90vw, 340px);
        padding: 10px 12px;
        background: #0a0c1e;
        border: 2px solid #e8b849;
        color: #cccccc;
        font-family: 'Press Start 2P', monospace;
        pointer-events: auto;
      }
      .sw-update-label {
        font-size: 10px;
        letter-spacing: 1px;
        color: #f5d77a;
        white-space: nowrap;
      }
      .sw-update-restart {
        background: #12111f;
        color: #cccccc;
        border: 2px solid #3a3660;
        padding: 6px 8px;
        font-family: 'Press Start 2P', monospace;
        font-size: var(--re-pf-9, 9px);
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .sw-update-restart:hover {
        border-color: #e8b849;
        color: #f5d77a;
        background: rgba(232, 184, 73, 0.06);
      }
      .sw-update-restart:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .sw-update-dismiss {
        background: transparent;
        color: #8888aa;
        border: none;
        padding: 0 2px;
        font-family: 'Press Start 2P', monospace;
        font-size: var(--re-pf-14, 14px);
        line-height: 1;
        cursor: pointer;
        transition: color 0.15s;
      }
      .sw-update-dismiss:hover {
        color: #e8b849;
      }
      body:has(#auth-overlay[style*='display: flex']) #rotate-prompt {
        display: none !important;
      }
      .sw-update-toast[hidden] {
        display: none;
      }
      .sw-update-restart,
      .sw-update-dismiss,
      #rotate-lock {
        min-width: 44px;
        min-height: 44px;
      }
      .sw-update-label {
        font:
          14px/1.4 Arial,
          sans-serif;
        letter-spacing: 0;
      }
      #rotate-lock {
        color: #eee;
        background: #232638;
        border: 1px solid #8888aa;
        font:
          16px/1.4 Arial,
          sans-serif;
        padding: 8px 16px;
      }
    </style>
  </head>
  <body>
    <div id="auth-overlay">
      <div id="auth-wrapper">
        <canvas id="auth-bg" aria-hidden="true"></canvas>
      </div>
      <div id="auth-content">
        <div class="re-keyart-lockup">
          <h1 class="re-keyart-title">Rogue Emblem</h1>
          <div class="re-keyart-rule" aria-hidden="true"><span></span><i></i><span></span></div>
          <p class="re-keyart-sub">The Hollow Sun</p>
        </div>
        <div class="auth-panel">
          <form id="auth-form">
            <input
              type="text"
              id="auth-username"
              aria-label="Username"
              placeholder="Username"
              autocomplete="username"
              required
              minlength="3"
              maxlength="20"
            />
            <input
              type="password"
              id="auth-password"
              aria-label="Password"
              placeholder="Password"
              autocomplete="current-password"
              required
              minlength="6"
            />
            <button type="submit" id="auth-submit">Log In</button>
          </form>
          <p id="auth-error" role="status" aria-live="polite"></p>
          <button type="button" id="auth-toggle">Don't have an account? Register</button>
          <button type="button" class="offline-link" id="auth-skip">Play offline</button>
          <dialog id="offline-confirm" aria-labelledby="offline-title">
            <h2 id="offline-title">Play without cloud saves?</h2>
            <p>
              Your progress will save on this device. It will not sync to other devices while
              playing offline.
            </p>
            <button type="button" data-offline-cancel>Back to sign in</button>
            <button type="button" data-offline-continue>Play offline</button>
          </dialog>
        </div>
      </div>
    </div>
    <div id="game-wrapper">
      <div id="mobile-left-panel" class="mobile-panel">
        <button data-action="resetView" class="mobile-btn">
          <span class="mobile-btn-icon">&#x21bb;</span>
          <span class="mobile-btn-label">Reset</span>
        </button>
        <button data-action="cancel" class="mobile-btn">
          <span class="mobile-btn-icon">&times;</span>
          <span class="mobile-btn-label">Cancel</span>
        </button>
        <button data-action="menu" class="mobile-btn">
          <span class="mobile-btn-icon">&#9776;</span>
          <span class="mobile-btn-label">Menu</span>
        </button>
      </div>
      <div id="game-container"></div>
      <div id="mobile-right-panel" class="mobile-panel"></div>
    </div>

    <div id="rotate-prompt" role="status" aria-live="polite">
      <p>&#x21bb; Rotate your device to landscape</p>
      <button type="button" id="rotate-lock" hidden>Use landscape</button>
    </div>

    <script>
      // --- Auth screen: login music + teardown hook. The key art itself is mounted by
      // main.js through the shared backdrop helper (src/art/keyart/keyArtBackdrop.js),
      // the same one TitleScene uses, so the two screens always match.
      (function () {
        var canvas = document.getElementById('auth-bg');

        // --- Music ---
        var musicVol = 0.5;
        try {
          var s = JSON.parse(localStorage.getItem('emblem_rogue_settings') || '{}');
          if (typeof s.musicVolume === 'number') musicVol = s.musicVolume;
        } catch (_) {}

        var bgMusic = new Audio();
        bgMusic.preload = 'none';
        bgMusic.src = 'assets/audio/music/music_login.mp3';
        bgMusic.loop = true;
        bgMusic.volume = musicVol;

        function tryPlayMusic() {
          if (!bgMusic) return;
          bgMusic.play().catch(function () {});
        }

        // Start music on first user interaction (typing or clicking)
        function onFirstInteraction() {
          tryPlayMusic();
          document.removeEventListener('click', onFirstInteraction);
          document.removeEventListener('keydown', onFirstInteraction);
        }
        document.addEventListener('click', onFirstInteraction);
        document.addEventListener('keydown', onFirstInteraction);
        tryPlayMusic(); // also try immediately (succeeds if autoplay allowed)

        // Expose cleanup for main.js to call (after it destroys the backdrop).
        window.stopAuthScreen = function () {
          if (canvas) canvas.remove();
          canvas = null;
          // Remove interaction listeners FIRST to prevent late events from restarting music
          document.removeEventListener('click', onFirstInteraction);
          document.removeEventListener('keydown', onFirstInteraction);
          // Stop and discard audio — null ref prevents any pending .play() Promise from mattering
          if (bgMusic) {
            bgMusic.pause();
            bgMusic.src = '';
            bgMusic = null;
          }
        };
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
